<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>SAIYA CYBER - Customize</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #050508;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Kanit', sans-serif;
            display: flex;
        }

        .customize-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            padding: 20px;
            gap: 20px;
        }

        /* Panel พื้นฐาน */
        .panel {
            background: rgba(26, 26, 36, 0.8);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .panel-title {
            color: #00f3ff;
            font-size: 1.3rem;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }

        /* 1. ฝั่งซ้าย: เพิ่มส่วนแสดงชื่อตัวละคร */
        .left-panel {
            flex: 0.8;
            justify-content: space-between;
        }

        .char-info-box {
            background: #111;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            text-align: center;
            margin-bottom: 15px;
        }

        .char-label {
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .char-name {
            color: #39ff14;
            font-size: 1.4rem;
            font-weight: bold;
            margin-top: 5px;
        }

        .btn-back {
            width: 100%;
            height: 60px;
            margin-top: auto;
            background: #ff2a2a;
            border: none;
            color: white;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 0 15px rgba(255, 42, 42, 0.4);
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-back:active {
            transform: scale(0.95);
            background: #cc0000;
        }

        /* 2. ฝั่งกลาง: ตัวละคร Preview */
        .center-panel {
            flex: 1.5;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at center, #1a1a24 0%, #050508 100%);
        }

        .hero-preview {
            width: 200px;
            height: 300px;
            background: #111;
            border: 2px solid #555;
            border-radius: 15px;
            animation: float 3s infinite ease-in-out;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }

        .pedestal {
            width: 250px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #00f3ff;
            position: absolute;
            bottom: 20%;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
            transform: rotateX(70deg);
            z-index: 1;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }

            100% {
                transform: translateY(0);
            }
        }

        /* 3. ฝั่งขวา: คลังไอเทม */
        .right-panel {
            flex: 2.2;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .item-slot {
            background: #111;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        .item-slot.selected {
            border-color: #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            background: #1a1a24;
        }

        .item-slot.equipped {
            border-color: #39ff14;
        }

        .equipped-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #39ff14;
            color: black;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }

        .item-slot.equipped .equipped-badge {
            display: block;
        }

        .item-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .item-name {
            font-size: 1rem;
            color: #fff;
            font-weight: bold;
            text-align: center;
        }

        .item-details {
            margin-top: auto;
            background: #111;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-desc h3 {
            color: #00f3ff;
            font-size: 1.2rem;
        }

        .item-desc p {
            color: #ccc;
            font-size: 0.95rem;
        }

        .btn-equip {
            background: #00f3ff;
            border: none;
            color: black;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .btn-equip.active {
            background: #39ff14;
        }
    </style>
</head>

<body>

    <div class="customize-wrapper">

        <!-- ฝั่งซ้าย: ข้อมูลตัวละคร และปุ่มกลับ -->
        <div class="panel left-panel">
            <h2 class="panel-title">จัดการตัวละคร</h2>

            <div class="char-info-box">
                <div class="char-label">กำลังแต่ง:</div>
                <div class="char-name">นักรบไซเบอร์ V.1</div>
            </div>

            <button class="btn-back" onclick="location.href='index.html'">◀ กลับหน้าหลัก</button>
        </div>

        <!-- ฝั่งกลาง: Preview -->
        <div class="panel center-panel">
            <div class="hero-preview">🧑‍🎤</div>
            <div class="pedestal"></div>
        </div>

        <!-- ฝั่งขวา: คลังไอเทม -->
        <div class="panel right-panel">
            <h2 class="panel-title">อุปกรณ์และแฟชั่น</h2>

            <div class="inventory-grid">
                <div class="item-slot equipped"
                    onclick="selectItem(this, 'หน้ากากยักษ์นีออน', 'เพิ่มความน่าเกรงขาม ศัตรูชะงัก 0.5 วินาที')">
                    <div class="equipped-badge">ใส่แล้ว</div>
                    <div class="item-icon">👹</div>
                    <div class="item-name">หน้ากากยักษ์นีออน</div>
                </div>
                <div class="item-slot"
                    onclick="selectItem(this, 'แจ็คเก็ตลงยันต์', 'เรืองแสงในที่มืด เพิ่มการหลบหลีก')">
                    <div class="equipped-badge">ใส่แล้ว</div>
                    <div class="item-icon">🧥</div>
                    <div class="item-name">แจ็คเก็ตลงยันต์</div>
                </div>
                <div class="item-slot" onclick="selectItem(this, 'รองเท้าเกี๊ยะไอพ่น', 'ทิ้งรอยไฟเมื่อพุ่งตัว')">
                    <div class="equipped-badge">ใส่แล้ว</div>
                    <div class="item-icon">👟</div>
                    <div class="item-name">รองเท้าเกี๊ยะไอพ่น</div>
                </div>
                <div class="item-slot" onclick="selectItem(this, 'รอยสักมังกรอาคม', 'ออร่าสีทองรอบตัว เพิ่มพลังโจมตี')">
                    <div class="equipped-badge">ใส่แล้ว</div>
                    <div class="item-icon">🐉</div>
                    <div class="item-name">รอยสักมังกรอาคม</div>
                </div>
            </div>

            <div class="item-details">
                <div class="item-desc">
                    <h3 id="preview-name">หน้ากากยักษ์นีออน</h3>
                    <p id="preview-desc">เพิ่มความน่าเกรงขาม ศัตรูชะงัก 0.5 วินาที</p>
                </div>
                <button id="btn-equip" class="btn-equip active" onclick="toggleEquip()">ถอดออก</button>
            </div>
        </div>

    </div>

    <script>
        let currentSelectedItem = document.querySelector('.item-slot.equipped');

        function selectItem(element, name, desc) {
            document.querySelectorAll('.item-slot').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            currentSelectedItem = element;
            document.getElementById('preview-name').innerText = name;
            document.getElementById('preview-desc').innerText = desc;
            let btn = document.getElementById('btn-equip');
            btn.innerText = element.classList.contains('equipped') ? "ถอดออก" : "สวมใส่";
            btn.className = element.classList.contains('equipped') ? "btn-equip active" : "btn-equip";
        }

        function toggleEquip() {
            if (!currentSelectedItem) return;
            let btn = document.getElementById('btn-equip');
            if (currentSelectedItem.classList.contains('equipped')) {
                currentSelectedItem.classList.remove('equipped');
                btn.innerText = "สวมใส่";
                btn.classList.remove('active');
            } else {
                currentSelectedItem.classList.add('equipped');
                btn.innerText = "ถอดออก";
                btn.classList.add('active');
            }
        }
    </script>

</body>

</html>
