<div class="battle-container">
    <canvas id="gameCanvas"></canvas>

    <div id="gameResultOverlay">
        <div id="victoryScreen" class="result-box"
            style="display: none; border: 2px solid #39ff14; box-shadow: 0 0 30px rgba(57,255,20,0.3);">
            <h1 style="color: #39ff14; font-size: 3rem; text-shadow: 0 0 15px #39ff14;">ชัยชนะ!</h1>
            <div style="margin: 20px 0; font-size: 1.2rem;">ได้รับเหรียญทอง: <span
                    style="color: #ffbf00; font-size: 1.5rem;">+500 🟡</span></div>
            <button class="result-btn" onclick="navigateTo('battle')">ด่านต่อไป</button>
            <button class="result-btn back" onclick="navigateTo('lobby')">หน้าหลัก</button>
        </div>
        <div id="defeatScreen" class="result-box"
            style="display: none; border: 2px solid #ff2a2a; box-shadow: 0 0 30px rgba(255,42,42,0.3);">
            <h1 style="color: #ff2a2a; font-size: 3rem; text-shadow: 0 0 15px #ff2a2a;">พ่ายแพ้...</h1>
            <p style="margin: 20px 0; color: #ccc;">พลังอาคมของคุณยังไม่แกร่งพอ ฝึกฝนเพิ่มสิ!</p>
            <button class="result-btn" onclick="navigateTo('battle')">ลองใหม่</button>
            <button class="result-btn back" onclick="navigateTo('lobby')">หน้าหลัก</button>
        </div>
    </div>

    <div class="top-left-zone">
        <button class="btn-magic-menu" onclick="toggleMenu()">✨</button>
        <div id="subMenu" class="sub-menu">
            <button class="btn-sub" onclick="triggerBuffalo()">🐃</button>
            <button class="btn-sub" onclick="triggerHeal()">💊</button>
        </div>
    </div>

    <div class="hud-bottom-center">
        <div style="font-weight: bold; margin-bottom: 5px;">ผู้เล่น</div>
        <div class="hp-bar">
            <div id="hpFill" class="hp-fill" style="width: 100%;"></div>
        </div>
        <p id="posDisplay">X: 0 | Y: 0</p>
    </div>

    <div class="controls-layer">
        <div class="joystick-zone" id="joystickZone">
            <div class="joystick-knob" id="joystickKnob"></div>
        </div>
        <button class="btn-steel-punch" onclick="triggerSteelPunch()">👊</button>
        <div class="action-zone">
            <div class="btn btn-sword" onclick="triggerAction('sword')">⚔️</div>
            <div class="btn btn-punch" onclick="triggerAction('punch')">🤛</div>
            <div class="btn btn-kick" onclick="triggerAction('kick')">🦵</div>
            <div class="btn btn-magic" onclick="triggerMagic()">⚡</div>
            <div class="btn btn-dodge" onclick="triggerRoll()">💨</div>
        </div>
    </div>
</div>
